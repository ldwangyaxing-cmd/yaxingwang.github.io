<title>课堂任务 - 投屏展示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0c29;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;overflow:hidden;color:#fff}

.audio-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .5s}
.audio-overlay.hidden{opacity:0;pointer-events:none}
.audio-prompt{text-align:center}
.audio-prompt .icon{font-size:5rem;animation:pulse-icon 1.5s ease-in-out infinite}
@keyframes pulse-icon{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.audio-prompt p{font-size:1.4rem;margin-top:16px;color:rgba(255,255,255,.7)}

.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.2;transform:scale(.8)}100%{opacity:1;transform:scale(1.2)}}

.header{position:relative;z-index:10;text-align:center;padding:30px 20px 10px}
.task-title{font-size:2.4rem;font-weight:800;background:linear-gradient(90deg,#f093fb,#f5576c,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{0%{filter:brightness(1)}100%{filter:brightness(1.3)}}
.task-subtitle{font-size:1.1rem;color:rgba(255,255,255,.6);margin-top:8px}

.counter{position:fixed;top:20px;right:30px;z-index:20;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 20px;text-align:center}
.counter-num{font-size:2.2rem;font-weight:800;color:#ffd200}
.counter-label{font-size:.8rem;color:rgba(255,255,255,.6)}

.music-ctrl{position:fixed;top:20px;left:30px;z-index:20;display:flex;gap:8px;align-items:center}
.music-btn{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.4rem;transition:all .3s}
.music-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.1)}
.music-btn.playing{animation:pulse-music 1s ease-in-out infinite}
@keyframes pulse-music{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.track-name{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:6px 14px;font-size:.8rem;color:rgba(255,255,255,.7);white-space:nowrap}

.tower-area{position:relative;z-index:10;display:flex;flex-direction:column-reverse;align-items:center;padding:20px;gap:8px;margin-top:20px;max-height:calc(100vh - 180px);overflow-y:auto;scrollbar-width:none}
.tower-area::-webkit-scrollbar{display:none}

.sub-block{display:flex;align-items:center;gap:12px;padding:14px 24px;border-radius:16px;font-size:1.1rem;font-weight:600;animation:slideUp .6s cubic-bezier(.34,1.56,.64,1);transform-origin:bottom center;min-width:300px;max-width:600px;position:relative;overflow:hidden}
.sub-block::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.05));pointer-events:none}
@keyframes slideUp{0%{opacity:0;transform:translateY(60px) scale(.8)}60%{transform:translateY(-10px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}
.sub-rank{font-size:1.6rem;min-width:40px;text-align:center}
.sub-animal{font-size:2rem;animation:bounce-animal 2s ease-in-out infinite}
@keyframes bounce-animal{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sub-name{flex:1;font-size:1.3rem}
.sub-time{font-size:.8rem;opacity:.6}
.rank-1{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#5a3e00;font-size:1.3rem;box-shadow:0 0 30px rgba(255,215,0,.4)}
.rank-1 .sub-rank{position:relative}
.rank-1 .sub-rank::after{content:'👑';position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:1.6rem;animation:crown-bounce 1s ease-in-out infinite}
@keyframes crown-bounce{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(5deg)}}
.rank-2{background:linear-gradient(135deg,#c0c0c0,#a8a8a8);color:#333;box-shadow:0 0 20px rgba(192,192,192,.3)}
.rank-3{background:linear-gradient(135deg,#cd7f32,#b8690e);color:#fff;box-shadow:0 0 20px rgba(205,127,50,.3)}
.rank-other{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15)}

.balloon-container{position:fixed;bottom:-100px;z-index:30;pointer-events:none}
.balloon{width:80px;height:100px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;position:relative;animation:float-up 4s ease-out forwards}
.balloon::after{content:'';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:2px;height:40px;background:rgba(255,255,255,.4)}
.balloon-name{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-size:.9rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
@keyframes float-up{0%{transform:translateY(0) rotate(0deg);opacity:1}30%{opacity:1}100%{transform:translateY(calc(-100vh - 200px)) rotate(15deg);opacity:0}}

.confetti{position:fixed;top:-10px;z-index:25;pointer-events:none;animation:confetti-fall 3s linear forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

.notif{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:40;background:rgba(0,0,0,.7);backdrop-filter:blur(20px);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:40px 60px;text-align:center;animation:notif-pop .6s cubic-bezier(.34,1.56,.64,1) forwards}

function initAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.20;
  masterGain.connect(audioCtx.destination);
}

function unlockAudio(){
  if(!audioCtx) initAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  audioUnlocked = true;
  document.getElementById('audioOverlay').classList.add('hidden');
  switchTrack(0);
  startMusic();
}

// ---- Playback primitives ----
function playNote(freq, time, dur, type, vol){
  if(!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, time);
  g.gain.setValueAtTime(vol, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(time); osc.stop(time + dur + 0.02);
}

function playNoise(time, dur, vol, hpFreq){
  if(!audioCtx) return;
  var len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
  var src = audioCtx.createBufferSource(); src.buffer = buf;
  var g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  var hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = hpFreq||7000;
  src.connect(hp); hp.connect(g); g.connect(masterGain);
  src.start(time); src.stop(time + dur + 0.01);
}

function playKick(time){
  if(!audioCtx) return;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(35, time + 0.12);
  g.gain.setValueAtTime(0.35, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
  osc.connect(g); g.connect(masterGain);
  osc.start(time); osc.stop(time + 0.2);
}

// ---- Scheduler ----
function scheduler(){
  if(!musicPlaying || !audioCtx) return;
  var tr = tracks[currentTrack];
  var beatSec = 60 / tr.bpm;

  while(nextNoteTime < audioCtx.currentTime + 0.12){
    var t = nextNoteTime;
    var mi = beatIndex % tr.melody.length;
    var bi = beatIndex % tr.bassNotes.length;
    var di = beatIndex % tr.kick.length;

    // Melody
    playNote(tr.melody[mi], t, beatSec*0.7, tr.melodyType, tr.melodyVol);

    // Octave sparkle on downbeats
    if(beatIndex % 4 === 0){
      playNote(tr.melody[mi]*2, t, beatSec*0.25, 'sine', 0.03);
    }

    // Bass
    playNote(tr.bassNotes[bi], t, beatSec*0.85, 'sine', 0.12);

    // Chords on chord beats
    if(tr.chordEvery && beatIndex % tr.chordEvery === 0){
      var ci = Math.floor(beatIndex / tr.chordEvery) % tr.chordNotes.length;
      var chord = tr.chordNotes[ci];
      for(var cn=0; cn<chord.length; cn++){
        playNote(chord[cn], t, beatSec*tr.chordEvery*0.5, 'sine', 0.04);
      }
    }

    // Drums
    if(tr.kick[di]) playKick(t);
    if(tr.snare[di]) playNoise(t, 0.07, 0.07, 4000);
    if(tr.hihat[di]) playNoise(t, 0.025, 0.025, 9000);

    nextNoteTime += beatSec;
    beatIndex++;
  }
  musicTimer = setTimeout(scheduler, 20);
}

function startMusic(){
  if(!audioCtx || musicPlaying) return;
  musicPlaying = true;
  nextNoteTime = audioCtx.currentTime + 0.05;
  beatIndex = 0;
  document.getElementById('musicBtn').textContent = '🎵';
  document.getElementById('musicBtn').classList.add('playing');
  document.getElementById('trackName').textContent = tracks[currentTrack].name;
  scheduler();
}

function stopMusic(){
  musicPlaying = false;
  clearTimeout(musicTimer);
  document.getElementById('musicBtn').textContent = '🔇';
  document.getElementById('musicBtn').classList.remove('playing');
}

function switchTrack(idx){
  currentTrack = idx % tracks.length;
  document.getElementById('trackName').textContent = tracks[currentTrack].name;
  if(musicPlaying){
    stopMusic();
    startMusic();
  }
}

function toggleMusic(){
  if(!audioUnlocked){ unlockAudio(); return; }
  if(musicPlaying) stopMusic();
  else startMusic();
}

// ---- Sound effects ----
function playDing(){
  if(!audioCtx || !audioUnlocked) return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  var t=audioCtx.currentTime;
  [523.25,659.25,783.99,1046.5].forEach(function(f,i){
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.2,t+i*0.08);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.6);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t+i*0.08); o.stop(t+i*0.08+0.7);
  });
}

function playFanfare(){
  if(!audioCtx || !audioUnlocked) return;
  var t=audioCtx.currentTime;
  [392,523.25,659.25,783.99,1046.5].forEach(function(f,i){
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(0.12,t+i*0.1);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.1+0.9);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t+i*0.1); o.stop(t+i*0.1+1.0);
  });
}

// ---- Confetti / Balloon / Notif / Tower ----
function spawnConfetti(count){
  var colors=['#f093fb','#f5576c','#ffd200','#43e97b','#38f9d7','#667eea','#ff6b6b','#feca57','#a29bfe','#fd79a8'];
  for(var i=0;i<(count||40);i++){
    var c=document.createElement('div'); c.className='confetti';
    var size=Math.random()*10+6;
    var shapes=['50%','2px','0'];
    var br=shapes[Math.floor(Math.random()*shapes.length)];
    c.style.cssText='left:'+Math.random()*100+'%;width:'+size+'px;height:'+size*0.6+'px;background:'+colors[i%colors.length]+';border-radius:'+br+';animation-delay:'+Math.random()*0.8+'s;animation-duration:'+(2+Math.random()*2)+'s';
    document.body.appendChild(c);
    setTimeout(function(el){el.remove()}.bind(null,c),5000);
  }
}

function spawnBalloon(name,color){
  var container=document.createElement('div');
  container.className='balloon-container';
  container.style.left=Math.random()*70+15+'%';
  var b=document.createElement('div'); b.className='balloon';
  b.style.background=color;
  b.style.boxShadow='inset -10px -10px 20px rgba(0,0,0,.15), inset 5px 5px 10px rgba(255,255,255,.3)';
  var n=document.createElement('div'); n.className='balloon-name'; n.textContent=name;
  b.appendChild(n); container.appendChild(b); document.body.appendChild(container);
  setTimeout(function(){container.remove()},5000);
}

function showNotif(entry){
  var existing=document.querySelector('.notif');
  if(existing) existing.remove();
  var d=document.createElement('div'); d.className='notif';
  var medal=entry.rank===1?'🥇 第1名！太棒了！':entry.rank===2?'🥈 第2名！厉害！':entry.rank===3?'🥉 第3名！加油！':'第'+entry.rank+'名 完成！';
  d.innerHTML='<div class="notif-animal">'+entry.animal+'</div><div class="notif-name">'+entry.name+'</div><div class="notif-rank">'+medal+'</div>';
  document.body.appendChild(d);
  setTimeout(function(){d.classList.add('notif-hide');setTimeout(function(){d.remove()},500)},2500);
}

function addToTower(entry){
  var t=document.getElementById('tower');
  var block=document.createElement('div');
  var cls='sub-block rank-other';
  if(entry.rank===1) cls='sub-block rank-1';
  else if(entry.rank===2) cls='sub-block rank-2';
  else if(entry.rank===3) cls='sub-block rank-3';
  block.className=cls;
  var medal=entry.rank===1?'🥇':entry.rank===2?'🥈':entry.rank===3?'🥉':entry.rank;
  block.innerHTML='<div class="sub-rank">'+medal+'</div><div class="sub-animal">'+entry.animal+'</div><div class="sub-name">'+entry.name+'</div><div class="sub-time">'+entry.time+'</div>';
  if(t.firstChild) t.insertBefore(block,t.firstChild);
  else t.appendChild(block);
}

function updateCounter(){
  document.getElementById('counterNum').textContent=submissions.length;
}

// ---- Socket events ----
socket.on('task_updated',function(data){
  document.getElementById('taskTitle').textContent=data.title||'等待教师发布任务…';
  document.getElementById('taskSubtitle').textContent=data.active?'任务进行中…同学们加油！':'任务已结束';
});

socket.on('submissions_cleared',function(){
  submissions=[];
  document.getElementById('tower').innerHTML='';
  updateCounter();
});

socket.on('new_submission',function(entry){
  submissions.push(entry);
  updateCounter();
  addToTower(entry);
  showNotif(entry);
  if(entry.rank<=3) playFanfare(); else playDing();
  spawnConfetti(entry.rank<=3?60:35);
  var bc=['#f093fb','#667eea','#f5576c','#43e97b','#ffd200','#38f9d7','#ff6b6b','#a29bfe','#fd79a8','#feca57'];
  for(var i=0;i<3;i++){
    (function(idx){setTimeout(function(){spawnBalloon(entry.name,bc[(entry.rank+idx)%bc.length])},idx*300)})(i);
  }
});

socket.on('music_toggle',function(){
  if(!audioUnlocked) unlockAudio();
  else toggleMusic();
});

socket.on('music_switch',function(data){
  if(!audioUnlocked) unlockAudio();
  switchTrack(data.track);
  if(!musicPlaying) startMusic();
});

// Init existing data
{% for s in submissions %}
submissions.push({{ s | tojson }});
addToTower({{ s | tojson }});
{% endfor %}
updateCounter();
{% if task.title %}
document.getElementById('taskTitle').textContent='{{ task.title }}';
document.getElementById('taskSubtitle').textContent={{ 'true' if task.active else 'false' }}?'任务进行中…同学们加油！':'任务已结束';
{% endif %}
</script>
