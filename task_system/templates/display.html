<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂任务 - 投屏展示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0c29;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;overflow:hidden;color:#fff}

/* Stars background */
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.2;transform:scale(.8)}100%{opacity:1;transform:scale(1.2)}}

/* Header */
.header{position:relative;z-index:10;text-align:center;padding:30px 20px 10px}
.task-title{font-size:2.4rem;font-weight:800;background:linear-gradient(90deg,#f093fb,#f5576c,#ffd200);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{0%{filter:brightness(1)}100%{filter:brightness(1.3)}}
.task-subtitle{font-size:1.1rem;color:rgba(255,255,255,.6);margin-top:8px}
.waiting{font-size:1.8rem;color:rgba(255,255,255,.4);margin-top:80px}

/* Counter */
.counter{position:fixed;top:20px;right:30px;z-index:20;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 20px;text-align:center}
.counter-num{font-size:2.2rem;font-weight:800;color:#ffd200}
.counter-label{font-size:.8rem;color:rgba(255,255,255,.6)}

/* Music btn */
.music-btn{position:fixed;top:20px;left:30px;z-index:20;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.4rem;transition:all .3s}
.music-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.1)}
.music-btn.playing{animation:pulse-music 1s ease-in-out infinite}
@keyframes pulse-music{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* Tower area */
.tower-area{position:relative;z-index:10;display:flex;flex-direction:column-reverse;align-items:center;padding:20px;gap:8px;margin-top:20px;max-height:calc(100vh - 180px);overflow-y:auto;scrollbar-width:none}
.tower-area::-webkit-scrollbar{display:none}

/* Submission block */
.sub-block{display:flex;align-items:center;gap:12px;padding:14px 24px;border-radius:16px;font-size:1.1rem;font-weight:600;animation:slideUp .6s cubic-bezier(.34,1.56,.64,1);transform-origin:bottom center;min-width:300px;max-width:600px;position:relative;overflow:hidden}
.sub-block::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.05));pointer-events:none}
@keyframes slideUp{0%{opacity:0;transform:translateY(60px) scale(.8)}60%{transform:translateY(-10px) scale(1.05)}100%{opacity:1;transform:translateY(0) scale(1)}}

.sub-rank{font-size:1.6rem;min-width:40px;text-align:center}
.sub-animal{font-size:2rem;animation:bounce-animal 2s ease-in-out infinite}
@keyframes bounce-animal{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sub-name{flex:1;font-size:1.3rem}
.sub-time{font-size:.8rem;opacity:.6}

.rank-1{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#5a3e00;font-size:1.3rem;box-shadow:0 0 30px rgba(255,215,0,.4)}
.rank-1 .sub-rank::after{content:'👑';position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:1.8rem;animation:crown-bounce 1s ease-in-out infinite}
@keyframes crown-bounce{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(5deg)}}
.rank-2{background:linear-gradient(135deg,#c0c0c0,#a8a8a8);color:#333;box-shadow:0 0 20px rgba(192,192,192,.3)}
.rank-3{background:linear-gradient(135deg,#cd7f32,#b8690e);color:#fff;box-shadow:0 0 20px rgba(205,127,50,.3)}
.rank-other{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15)}

/* Balloon */
.balloon-container{position:fixed;bottom:-100px;z-index:30;pointer-events:none}
.balloon{width:80px;height:100px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;position:relative;animation:float-up 4s ease-out forwards}
.balloon::after{content:'';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);width:2px;height:40px;background:rgba(255,255,255,.4)}
.balloon-name{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-size:.9rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
@keyframes float-up{0%{transform:translateY(0) rotate(0deg);opacity:1}30%{opacity:1}100%{transform:translateY(calc(-100vh - 200px)) rotate(15deg);opacity:0}}

/* Confetti */
.confetti{position:fixed;top:-10px;z-index:25;pointer-events:none;animation:confetti-fall 3s linear forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Firework burst */
.firework{position:fixed;z-index:25;pointer-events:none}
.spark{position:absolute;border-radius:50%;animation:spark-out .8s ease-out forwards}
@keyframes spark-out{0%{transform:translate(0,0) scale(1);opacity:1}100%{opacity:0}}

/* Notification popup */
.notif{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:40;background:rgba(0,0,0,.7);backdrop-filter:blur(20px);border:2px solid rgba(255,255,255,.2);border-radius:24px;padding:40px 60px;text-align:center;animation:notif-pop .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes notif-pop{0%{transform:translate(-50%,-50%) scale(0)}100%{transform:translate(-50%,-50%) scale(1)}}
.notif-animal{font-size:4rem}
.notif-name{font-size:2.4rem;font-weight:800;margin:10px 0;background:linear-gradient(90deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.notif-rank{font-size:1.2rem;color:rgba(255,255,255,.7)}
.notif-hide{animation:notif-hide .4s ease-in forwards}
@keyframes notif-hide{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="music-btn" id="musicBtn" onclick="toggleMusic()">🔇</div>

<div class="counter">
  <div class="counter-num" id="counterNum">0</div>
  <div class="counter-label">已完成</div>
</div>

<div class="header">
  <div class="task-title" id="taskTitle">等待教师发布任务…</div>
  <div class="task-subtitle" id="taskSubtitle">学生请访问此地址提交</div>
</div>

<div class="tower-area" id="tower"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
const socket = io();
let submissions = [];
let musicPlaying = false;
let audioCtx, gainNode;

// ---- Stars ----
(function createStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=Math.random()*3+1;
    s.style.cssText=`width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${Math.random()*3+2}s;animation-delay:${Math.random()*3}s`;
    c.appendChild(s);
  }
})();

// ---- Music (Web Audio API procedural) ----
function initAudio(){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  gainNode=audioCtx.createGain();
  gainNode.gain.value=0.15;
  gainNode.connect(audioCtx.destination);
}

const NOTES={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,C5:523.25,D5:587.33,E5:659.25,G5:783.99};
const melodyPattern=[
  ['E4',.15],['G4',.15],['C5',.15],['E5',.3],['D5',.15],['C5',.15],['G4',.3],
  ['A4',.15],['C5',.15],['E5',.15],['G5',.3],['E5',.15],['C5',.15],['D5',.3],
  ['G4',.15],['A4',.15],['B4',.15],['C5',.3],['E5',.15],['D5',.15],['C5',.3],
  ['E4',.15],['G4',.15],['A4',.15],['C5',.3],['G4',.15],['E4',.15],['G4',.3],
];
let melodyTimeout=null;

function playMelody(){
  if(!audioCtx||!musicPlaying)return;
  let t=audioCtx.currentTime;
  const tempo=0.18;
  melodyPattern.forEach(([note,dur])=>{
    const osc=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    osc.type='triangle';
    osc.frequency.value=NOTES[note];
    g.gain.setValueAtTime(0.12,t);
    g.gain.exponentialRampToValueAtTime(0.01,t+dur*tempo*3);
    osc.connect(g);g.connect(gainNode);
    osc.start(t);osc.stop(t+dur*tempo*3.5);
    t+=dur*tempo*2;

    // bass
    const bass=audioCtx.createOscillator();
    const bg=audioCtx.createGain();
    bass.type='sine';
    bass.frequency.value=NOTES[note]/2;
    bg.gain.setValueAtTime(0.06,t-dur*tempo*2);
    bg.gain.exponentialRampToValueAtTime(0.01,t);
    bass.connect(bg);bg.connect(gainNode);
    bass.start(t-dur*tempo*2);bass.stop(t+0.1);
  });
  const totalDur=melodyPattern.reduce((a,b)=>a+b[1]*0.18*2,0)*1000;
  melodyTimeout=setTimeout(()=>playMelody(),totalDur);
}

function toggleMusic(){
  if(!audioCtx)initAudio();
  musicPlaying=!musicPlaying;
  document.getElementById('musicBtn').textContent=musicPlaying?'🎵':'🔇';
  document.getElementById('musicBtn').classList.toggle('playing',musicPlaying);
  if(musicPlaying){
    if(audioCtx.state==='suspended')audioCtx.resume();
    playMelody();
  }else{
    clearTimeout(melodyTimeout);
  }
}

// ---- Sound effect ----
function playDing(){
  if(!audioCtx){initAudio();}
  if(audioCtx.state==='suspended')audioCtx.resume();
  const t=audioCtx.currentTime;
  [523.25,659.25,783.99].forEach((f,i)=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.2,t+i*0.1);
    g.gain.exponentialRampToValueAtTime(0.01,t+i*0.1+0.5);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(t+i*0.1);o.stop(t+i*0.1+0.6);
  });
}

// ---- Confetti ----
function spawnConfetti(){
  const colors=['#f093fb','#f5576c','#ffd200','#43e97b','#38f9d7','#667eea','#ff6b6b','#feca57'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti';
    const size=Math.random()*10+6;
    c.style.cssText=`left:${Math.random()*100}%;width:${size}px;height:${size*0.6}px;background:${colors[i%colors.length]};border-radius:2px;animation-delay:${Math.random()*0.5}s;animation-duration:${2+Math.random()*2}s`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}

// ---- Balloon ----
function spawnBalloon(name,color){
  const container=document.createElement('div');
  container.className='balloon-container';
  container.style.left=Math.random()*70+15+'%';
  const b=document.createElement('div');
  b.className='balloon';
  b.style.background=color;
  const n=document.createElement('div');
  n.className='balloon-name';
  n.textContent=name;
  b.appendChild(n);
  container.appendChild(b);
  document.body.appendChild(container);
  setTimeout(()=>container.remove(),5000);
}

// ---- Notification popup ----
function showNotif(entry){
  const existing=document.querySelector('.notif');
  if(existing)existing.remove();
  const d=document.createElement('div');
  d.className='notif';
  const medal=entry.rank===1?'🥇':entry.rank===2?'🥈':entry.rank===3?'🥉':`#${entry.rank}`;
  d.innerHTML=`<div class="notif-animal">${entry.animal}</div><div class="notif-name">${entry.name}</div><div class="notif-rank">${medal} 完成！</div>`;
  document.body.appendChild(d);
  setTimeout(()=>{d.classList.add('notif-hide');setTimeout(()=>d.remove(),500)},2500);
}

// ---- Tower ----
function addToTower(entry){
  const t=document.getElementById('tower');
  const block=document.createElement('div');
  let cls='sub-block rank-other';
  if(entry.rank===1)cls='sub-block rank-1';
  else if(entry.rank===2)cls='sub-block rank-2';
  else if(entry.rank===3)cls='sub-block rank-3';
  block.className=cls;
  block.style.animationDelay='.1s';

  const medal=entry.rank===1?'🥇':entry.rank===2?'🥈':entry.rank===3?'🥉':entry.rank;
  block.innerHTML=`
    <div class="sub-rank">${medal}</div>
    <div class="sub-animal">${entry.animal}</div>
    <div class="sub-name">${entry.name}</div>
    <div class="sub-time">${entry.time}</div>`;

  if(t.firstChild){t.insertBefore(block,t.firstChild);}
  else{t.appendChild(block);}
}

function updateCounter(){
  document.getElementById('counterNum').textContent=submissions.length;
}

// ---- Socket events ----
socket.on('task_updated',data=>{
  document.getElementById('taskTitle').textContent=data.title||'等待教师发布任务…';
  document.getElementById('taskSubtitle').textContent=data.active?'任务进行中…同学们加油！':'任务已结束';
});

socket.on('submissions_cleared',()=>{
  submissions=[];
  document.getElementById('tower').innerHTML='';
  updateCounter();
});

socket.on('new_submission',entry=>{
  submissions.push(entry);
  updateCounter();
  addToTower(entry);
  showNotif(entry);
  playDing();
  spawnConfetti();
  const balloonColors=['#f093fb','#667eea','#f5576c','#43e97b','#ffd200','#38f9d7','#ff6b6b'];
  spawnBalloon(entry.name,balloonColors[entry.rank%balloonColors.length]);
  spawnBalloon(entry.name,balloonColors[(entry.rank+3)%balloonColors.length]);
});

socket.on('music_toggle',data=>{
  if(data.playing!==musicPlaying)toggleMusic();
});

// Init with existing data
{% for s in submissions %}
submissions.push({{ s | tojson }});
addToTower({{ s | tojson }});
{% endfor %}
updateCounter();
{% if task.title %}
document.getElementById('taskTitle').textContent='{{ task.title }}';
document.getElementById('taskSubtitle').textContent={{ 'true' if task.active else 'false' }}?'任务进行中…同学们加油！':'任务已结束';
{% endif %}
</script>
</body>
</html>
