{% extends "base.html" %}
{% block title %}新建任务{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card form-card-wide">
    <h2>新建任务</h2>
    <form method="POST" action="{{ url_for('create_task') }}">
      <div class="form-group">
        <label for="title">任务标题</label>
        <input type="text" id="title" name="title" required placeholder="请输入任务标题" autofocus>
      </div>
      <div class="form-group">
        <label for="description">任务描述</label>
        <textarea id="description" name="description" rows="6" required
                  placeholder="详细描述任务要求…"></textarea>
      </div>
      <div class="form-group">
        <label for="deadline">截止日期（可选）</label>
        <input type="datetime-local" id="deadline" name="deadline">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">创建任务</button>
        <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-outline">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
