<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂任务系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.container{text-align:center;padding:40px}
h1{font-size:3rem;margin-bottom:16px;text-shadow:0 2px 10px rgba(0,0,0,.2)}
p{font-size:1.2rem;opacity:.9;margin-bottom:40px}
.cards{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
.card{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:40px 36px;width:260px;text-decoration:none;color:#fff;transition:all .3s}
.card:hover{transform:translateY(-8px);background:rgba(255,255,255,.25);box-shadow:0 20px 40px rgba(0,0,0,.2)}
.card-icon{font-size:3rem;margin-bottom:16px}
.card h2{font-size:1.3rem;margin-bottom:8px}
.card p{font-size:.9rem;opacity:.8;margin-bottom:0}
</style>
</head>
<body>
<div class="container">
  <h1>🎯 课堂任务系统</h1>
  <p>实时互动，让课堂更有趣</p>
  <div class="cards">
    <a href="/display" class="card">
      <div class="card-icon">🖥️</div>
      <h2>投屏展示</h2>
      <p>在教室大屏上展示任务和提交动画</p>
    </a>
    <a href="/submit" class="card">
      <div class="card-icon">📱</div>
      <h2>学生提交</h2>
      <p>完成任务后提交，看到自己的排名</p>
    </a>
    <a href="/teacher" class="card">
      <div class="card-icon">👨‍🏫</div>
      <h2>教师控制</h2>
      <p>发布任务、管理提交</p>
    </a>
  </div>
</div>
</body>
</html>
