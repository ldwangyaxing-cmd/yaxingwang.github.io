{% extends "base.html" %}
{% block title %}提交 - {{ task.title }}{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card form-card-wide">
    <h2>提交：{{ task.title }}</h2>
    <div class="task-detail-box">
      <strong>任务要求：</strong>
      <p>{{ task.description }}</p>
      {% if task.deadline %}
        <p class="text-muted">截止日期：{{ task.deadline }}</p>
      {% endif %}
    </div>
    <form method="POST" action="{{ url_for('submit_task', task_id=task.id) }}" enctype="multipart/form-data">
      <div class="form-group">
        <label for="content">提交内容（文字）</label>
        <textarea id="content" name="content" rows="6" placeholder="在此输入你的作业内容…"></textarea>
      </div>
      <div class="form-group">
        <label for="file">上传文件（可选，最大 50MB）</label>
        <input type="file" id="file" name="file">
        <small class="text-muted">支持 txt, pdf, doc, docx, xls, xlsx, ppt, pptx, zip, 图片, 代码文件等</small>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">提交</button>
        <a href="{{ url_for('student_tasks') }}" class="btn btn-outline">返回</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
