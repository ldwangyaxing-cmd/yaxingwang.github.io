<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;padding:20px}
.card{background:rgba(255,255,255,.1);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:40px 32px;max-width:380px;width:100%;text-align:center}
h2{margin-bottom:24px;font-size:1.4rem}
input{width:100%;padding:12px 16px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:1rem;margin-bottom:16px;outline:none}
input::placeholder{color:rgba(255,255,255,.4)}
input:focus{border-color:rgba(255,255,255,.6)}
button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s}
button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(102,126,234,.4)}
.hint{margin-top:14px;font-size:.8rem;color:rgba(255,255,255,.4)}
a{color:rgba(255,255,255,.6);text-decoration:none}
a:hover{color:#fff}
</style>
</head>
<body>
<div class="card">
  <h2>👨‍🏫 教师登录</h2>
  <form method="POST">
    <input type="password" name="password" placeholder="请输入教师密码" autofocus>
    <button type="submit">登录</button>
  </form>
  <p class="hint">默认密码：admin123</p>
  <p style="margin-top:12px"><a href="/">← 返回首页</a></p>
</div>
</body>
</html>
