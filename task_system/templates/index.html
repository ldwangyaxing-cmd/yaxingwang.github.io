{% extends "base.html" %}
{% block title %}首页 - 任务提交系统{% endblock %}
{% block content %}
<div class="hero">
  <h1>在线任务提交系统</h1>
  <p class="hero-sub">教师发布任务，学生在线提交，高效便捷地管理作业流程</p>
  <div class="hero-actions">
    <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg">教师登录</a>
    <a href="{{ url_for('student_login') }}" class="btn btn-secondary btn-lg">学生入口</a>
  </div>
</div>

<div class="features">
  <div class="feature-card">
    <div class="feature-icon">&#128218;</div>
    <h3>发布任务</h3>
    <p>教师可以创建任务，设置截止日期，随时管理任务状态</p>
  </div>
  <div class="feature-card">
    <div class="feature-icon">&#128228;</div>
    <h3>在线提交</h3>
    <p>学生查看任务详情，提交文字内容或上传文件</p>
  </div>
  <div class="feature-card">
    <div class="feature-icon">&#9989;</div>
    <h3>查看评审</h3>
    <p>教师查看所有提交，进行审核并给出反馈</p>
  </div>
</div>
{% endblock %}
